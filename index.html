<head>

<title>I'm here, Brian!</title>
<style>
  :root{--bg:#f1eee6;--card:#fff;--ink:#191b18;--mute:#6b6a63;--line:#e4e1d8;--blue:#0a66c2;--bubble:#f2f0ea;--pencil:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32' stroke='rgb(25,27,24)' stroke-width='1.2' stroke-linejoin='round'%3E%3Cpolygon points='3,22 17,8 29,20 15,30' fill='rgb(240,140,160)'/%3E%3Cpolygon points='3,22 17,8 22,13 8,27' fill='rgb(70,110,200)'/%3E%3Cpolygon points='8,27 22,13 29,20 15,30' fill='rgb(240,140,160)'/%3E%3C/svg%3E") 6 28, crosshair;}
  *{box-sizing:border-box;margin:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
  .card{position:fixed;left:50%;top:max(20px,4vh);transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 10px;box-shadow:0 1px 2px rgba(0,0,0,.05);z-index:1}
  .post{font-size:12px;color:var(--mute);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .c{display:flex;gap:10px;margin-bottom:10px}
  .av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
  .av.b{background:#8a6d3b}.av.d{background:var(--ink)}
  .bub{background:var(--bubble);border-radius:0 12px 12px 12px;padding:8px 12px;min-width:0}
  .bub b{font-size:13px}.bub small{color:var(--mute);font-size:12px;margin-left:6px}
  .bub p{margin-top:2px;font-size:14px}
  .bub .pill{color:var(--blue);font-weight:600}
  .acts{display:flex;gap:14px;font-size:12px;font-weight:600;color:var(--mute);margin:4px 0 0 46px}
  .acts button{all:unset;cursor:pointer}.acts button:hover{color:var(--blue)}
  .acts .n{font-weight:500;display:inline-block}
  .acts .pop .n{animation:pop .35s}
  @keyframes pop{40%{transform:scale(1.7)}}
  .lp{display:block;margin-top:8px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px}
  .lp:hover{border-color:var(--blue)}.lp em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--mute);margin-top:2px}
  .reply{margin-left:46px;margin-top:12px}
  .dots{display:inline-flex;gap:4px;padding:4px 0}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
  .ghost{background:#fff;border:1px solid var(--line);color:var(--ink);cursor:text}
  .ph{color:var(--mute)}
  .cursor{display:inline-block;width:1px;height:1em;background:var(--ink);vertical-align:-2px;margin-left:1px;animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .card{max-height:calc(100vh - 46vh - 24px);overflow-y:auto}
  .add{display:flex;gap:8px;margin:10px 0 4px;align-items:center}
  .add .av{background:var(--blue)}
  .add input{cursor:text;font:inherit;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;color:var(--ink);min-width:0}
  .add input:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .add #nm{width:84px;flex:none}.add #tx{flex:1}
  .add button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:8px 14px;background:var(--blue);color:#fff;cursor:pointer}
  .add button:disabled{background:#c9c6bd;cursor:default}
  .bub .del{all:unset;display:block;margin-top:4px;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer}
  .bub .del:hover{color:#c0392b}
  .c.new{animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
  .more{margin-top:10px}
  .scratch{position:fixed;right:max(20px,3vw);top:50%;transform:translateY(-50%) rotate(2deg);width:clamp(130px,19vw,280px);z-index:2}
  .scratch .box{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.14)}
  .scratch .shot{position:absolute;inset:0;display:block}
  .scratch .cap{text-decoration:none}.scratch .cap:hover{text-decoration:underline}
  .scratch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scratch,.scratch *{-webkit-user-select:none;user-select:none}
  .scratch canvas{cursor:var(--pencil);position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .7s}
  .scratch .cap{display:block;text-align:center;margin-top:8px;font:600 13px/1 -apple-system,Helvetica,sans-serif;color:var(--ink);animation:in .4s}
  @media (max-width:900px){.scratch{top:auto;bottom:64px;right:10px;transform:rotate(2deg);width:104px}}
  .stage{position:fixed;left:50%;bottom:-2vh;width:min(92vw,calc(46vh*.75));aspect-ratio:3/4;transform:translate(-50%,105%);transition:transform .8s cubic-bezier(.2,1.5,.4,1);z-index:2}
  .rig{position:relative;width:100%;height:100%;transform-origin:50% 100%;filter:drop-shadow(6px 7px 0 var(--ink));will-change:transform}
  .rig img{filter:grayscale(1) contrast(1.12);transform-origin:50% 90%;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none;-webkit-user-select:none;user-select:none}
  .rig img:first-child{opacity:1}
  .stage.up{transform:translate(-50%,0)}
  canvas{width:100%;height:100%;display:block;cursor:default;touch-action:none}
  .hint{position:fixed;right:20px;bottom:18px;text-align:right;font:11px/1.5 ui-monospace,Menlo,monospace;text-transform:uppercase;color:var(--mute);z-index:3}
</style>

    const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

      rig.append(im); imgs[name] = im;
    }
    let goofy=0, goofyTimer=0, goofyFlip=0, goofyPose=null;
    let tx=0, ty=0, mx=0, my=0, px=null, py=null, raf=0;
    function setPose(p){ goofyPose = p.startsWith('goofy') ? p : null; request(); }
    function track(){
      if(px===null) return;
      const r = rig.getBoundingClientRect();
      tx = clamp((px-(r.left+r.width/2))/Math.max(320, innerWidth*.3), -1, 1);
      ty = clamp((py-(r.top+r.height*.47))/Math.max(260, innerHeight*.35), -1, 1);
      if(!goofy) goofyPose = null;
      request();
    }
    function rest(){ px=null; tx=ty=0; request(); }
    function request(){ if(!raf) raf = requestAnimationFrame(draw); }
    // The sticker snaps to the photo that matches the cursor, with a little comic "pop", and leans toward it.
    let shown = 'front';
    function pick(){
      const ax = Math.abs(tx), ay = Math.abs(ty)*1.15, dead = shown==='front' ? .2 : .11;
      if(Math.max(ax,ay) < dead) return 'front';
      return ay>ax ? (ty<0 ? 'up' : 'down') : (tx<0 ? 'left' : 'right');
    }
    function draw(){
      raf = 0;
      mx += (tx-mx)*.16; my += (ty-my)*.16;
      const next = goofyPose || pick();
      if(next !== shown){
        shown = next;
        for(const k in imgs) imgs[k].style.opacity = k===shown ? 1 : 0;
        imgs[shown].animate([{transform:'scale(.95) rotate(-1.5deg)'},{transform:'scale(1.035) rotate(.8deg)',offset:.55},{transform:'none'}],{duration:240,easing:'ease-out'});
      }
      rig.style.transform = `translate(${mx*14}px,${my*8}px) rotate(${mx*3}deg)`;
      if(Math.abs(tx-mx)+Math.abs(ty-my) > .002) request();
    }

    addEventListener('pointermove', onPointer, {passive:true});

      onPointer(e);

    paint();
  })();

  // --- the reply ---
  const form0 = null;
  const replyText = "I’m here, Brian! \u{1F44B} Are you going to the Claude design meet-up next Wed? Hope to see you there! \u{1F3A8}";
  const reply = document.getElementById('replytext'), stage = document.querySelector('.stage');
  const rc = document.getElementById('rc'); let likes = 1;
  function bump(){ likes++; rc.textContent = likes; rc.parentElement.classList.remove('pop'); void rc.offsetWidth; rc.parentElement.classList.add('pop'); }
  document.getElementById('like').addEventListener('click', bump);
  const typing=document.getElementById('typing');
  setTimeout(()=>{ typing.hidden=false; }, 700);
  setTimeout(()=>{
    typing.hidden=true; const row=reply.closest('.c'); row.classList.add('new'); row.hidden=false;
    const chars=[...replyText]; let i=0;
    const t=setInterval(()=>{
      reply.textContent=chars.slice(0,++i).join('');
      if(i<chars.length) return;
      clearInterval(t);
      document.querySelector('.cursor').remove();
      document.getElementById('lp').hidden=false;
      form.hidden=false; more.hidden=false;     // comments appear once Daniel has finished typing
      setTimeout(()=>stage.classList.add('up'),350);
    },35);
  }, 2100);

})();
</script>
